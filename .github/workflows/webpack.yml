name: Monorepo Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: validate (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install root tooling
        # --ignore-scripts: skip native compilation (sharp, sqlite3, etc.) in CI
        # --legacy-peer-deps: avoid peer dep conflicts across workspace packages
        # --no-fund: suppress funding messages
        run: npm install --ignore-scripts --no-fund --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx --yes prisma validate --schema packages/database/prisma/schema.prisma

      - name: Verify Turborepo
        run: npx turbo --version

      - name: Check TypeScript config
        run: |
          # Verify each app/package has a valid tsconfig
          for f in apps/*/tsconfig.json packages/*/tsconfig.json; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✅ $f" || true
          done

      - name: Validate docker-compose syntax
        run: |
          if command -v docker &>/dev/null; then
            docker compose -f infrastructure/docker/docker-compose.yml config --quiet && echo "✅ docker-compose valid"
          else
            echo "⚠️  Docker not available in this runner, skipping"
          fi
