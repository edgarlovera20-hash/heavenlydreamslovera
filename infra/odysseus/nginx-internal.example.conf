# Nginx — Proxy inverso interno para Odysseus
# Solo para acceso LAN controlado (ej: desde el backend en otro servidor)
# NO usar en producción sin autenticación adicional.

server {
    listen 7001;
    server_name 127.0.0.1;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Solo aceptar peticiones del backend HD (ajustar IP)
        allow 127.0.0.1;
        deny all;
    }
}
