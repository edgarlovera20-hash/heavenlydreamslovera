# www.heavenlydreams.com.mx → HEAVENLY-DREAMS-WEB-2026 (static site)
server {
    listen 80;
    listen [::]:80;
    server_name heavenlydreams.com.mx www.heavenlydreams.com.mx;
    return 301 https://www.heavenlydreams.com.mx$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name heavenlydreams.com.mx www.heavenlydreams.com.mx;

    ssl_certificate     /etc/letsencrypt/live/www.heavenlydreams.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.heavenlydreams.com.mx/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/heavenly-dreams-web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
