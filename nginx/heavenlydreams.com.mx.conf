# HTTP → HTTPS redirect para ambos dominios
server {
    listen 80;
    server_name heavenlydreams.com.mx www.heavenlydreams.com.mx;
    return 301 https://www.heavenlydreams.com.mx$request_uri;
}

# Redirect bare domain → www
server {
    listen 443 ssl http2;
    server_name heavenlydreams.com.mx;

    ssl_certificate     /etc/letsencrypt/live/heavenlydreams.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heavenlydreams.com.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.heavenlydreams.com.mx$request_uri;
}

# Sitio de reclutamiento público → node server.cjs (puerto 4173)
server {
    listen 443 ssl http2;
    server_name www.heavenlydreams.com.mx;

    ssl_certificate     /etc/letsencrypt/live/heavenlydreams.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heavenlydreams.com.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
